version: 1.0

hooks:
  AfterInstall:
    - location: scripts/pull_image.sh
      timeout: 900

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 300

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300

permissions:
  - object: /scripts
    pattern: "*.sh"
    mode: 755
    type:
      - file
  - object: /
    pattern: "*.env"
    mode: 600
    type:
      - file
