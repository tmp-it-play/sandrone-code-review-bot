name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.xml"
      - LICENSE
      - .gitignore
      - .gitattributes
      - .env.example
      - docker-compose.yml
      - .harness/**
      - .reviewbot/**
      - .claude/**
      - .codex/**
      - .agents/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE/**
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PACKAGE_NAME: sandrone-code-review-bot
  CONTAINER_NAME: sandrone
  DOCKER_NETWORK: readygsm-net
  HOST_PORT: "10105"
  BASE_PATH: /sandrone
  REDIS_ADDR: redis:6379
  DASHBOARD_USERNAME: admin

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        id: preflight
        env:
          APP_ID: ${{ secrets.SANDRONE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SANDRONE_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.SANDRONE_WEBHOOK_SECRET }}
          MYSQL_DSN: ${{ secrets.SANDRONE_MYSQL_DSN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          missing=""
          for name in APP_ID APP_PRIVATE_KEY WEBHOOK_SECRET MYSQL_DSN DEPLOY_HOST DEPLOY_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "${GEMINI_API_KEY:-}${GROQ_API_KEY:-}${OPENROUTER_API_KEY:-}${NVIDIA_API_KEY:-}" ]; then
            missing="$missing (at-least-one-LLM-API-key)"
          fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy, missing secrets:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deploy env files
        if: steps.preflight.outputs.ready == 'true'
        env:
          APP_ID: ${{ secrets.SANDRONE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SANDRONE_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.SANDRONE_WEBHOOK_SECRET }}
          MYSQL_DSN: ${{ secrets.SANDRONE_MYSQL_DSN }}
          REDIS_PASSWORD: ${{ secrets.SANDRONE_REDIS_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          METRICS_TOKEN: ${{ secrets.SANDRONE_METRICS_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          write() {
            [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> deploy/sandrone.env || true
          }

          : > deploy/sandrone.env
          write SANDRONE_HTTP_ADDR ":8080"
          write SANDRONE_LOG_LEVEL "info"
          write SANDRONE_BASE_PATH "$BASE_PATH"
          write GITHUB_APP_ID "$APP_ID"
          write GITHUB_WEBHOOK_SECRET "$WEBHOOK_SECRET"
          write MYSQL_DSN "$MYSQL_DSN"
          write REDIS_ADDR "$REDIS_ADDR"
          write REDIS_PASSWORD "$REDIS_PASSWORD"
          write GEMINI_API_KEY "$GEMINI_API_KEY"
          write GROQ_API_KEY "$GROQ_API_KEY"
          write OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          write NVIDIA_API_KEY "$NVIDIA_API_KEY"
          write DASHBOARD_USERNAME "$DASHBOARD_USERNAME"
          write DASHBOARD_PASSWORD "$DASHBOARD_PASSWORD"
          write DASHBOARD_SESSION_SECRET "$DASHBOARD_SESSION_SECRET"
          write SANDRONE_METRICS_TOKEN "$METRICS_TOKEN"
          printf 'GITHUB_PRIVATE_KEY=%s\n' "$(printf '%s' "$APP_PRIVATE_KEY" | awk 'BEGIN{ORS=""} {printf "%s\\n", $0}')" >> deploy/sandrone.env

          {
            printf 'IMAGE=%s\n' "${IMAGE_NAME}:${GITHUB_SHA}"
            printf 'REVISION=%s\n' "$GITHUB_SHA"
            printf 'CONTAINER_NAME=%s\n' "$CONTAINER_NAME"
            printf 'DOCKER_NETWORK=%s\n' "$DOCKER_NETWORK"
            printf 'HOST_PORT=%s\n' "$HOST_PORT"
            printf 'BASE_PATH=%s\n' "$BASE_PATH"
            printf 'GHCR_USER=%s\n' "$GITHUB_ACTOR"
            printf 'GHCR_TOKEN=%s\n' "$GHCR_TOKEN"
          } > deploy/deploy.env

          echo "Wrote $(wc -l < deploy/sandrone.env) lines to deploy/sandrone.env"

      - name: Deploy to server
        if: steps.preflight.outputs.ready == 'true'
        uses: 8G4B/GSM-SV-Deploy@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: '22'
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source_path: deploy
          target_path: /tmp/sandrone-deploy
          deployspec_path: deploy/deployspec.yml

      - name: Remove local env files
        if: always()
        run: rm -f deploy/sandrone.env deploy/deploy.env

      - name: Delete ghcr package
        if: always() && steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GHCR_CLEANUP_TOKEN is not set, leaving the ghcr package in place"
            exit 0
          fi
          if gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}" --silent; then
            echo "Deleted the ghcr package"
          else
            echo "::warning::Failed to delete the ghcr package"
          fi
