name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.xml"
      - LICENSE
      - .gitignore
      - .gitattributes
      - .env.example
      - docker-compose.yml
      - .harness/**
      - .reviewbot/**
      - .claude/**
      - .codex/**
      - .agents/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE/**

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONTAINER_NAME: sandrone
  DOCKER_NETWORK: readygsm-net
  HOST_PORT: "10105"
  BASE_PATH: /sandrone
  REDIS_ADDR: redis:6379
  DASHBOARD_USERNAME: admin

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/sandrone

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          APP_ID: ${{ secrets.SANDRONE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SANDRONE_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.SANDRONE_WEBHOOK_SECRET }}
          MYSQL_DSN: ${{ secrets.SANDRONE_MYSQL_DSN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          required=(APP_ID APP_PRIVATE_KEY WEBHOOK_SECRET MYSQL_DSN DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DASHBOARD_PASSWORD DASHBOARD_SESSION_SECRET GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY NVIDIA_API_KEY MISTRAL_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)
          for name in "${required[@]}"; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All required deployment secrets are configured"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deploy env files
        env:
          APP_ID: ${{ secrets.SANDRONE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SANDRONE_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.SANDRONE_WEBHOOK_SECRET }}
          MYSQL_DSN: ${{ secrets.SANDRONE_MYSQL_DSN }}
          REDIS_PASSWORD: ${{ secrets.SANDRONE_REDIS_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRIVATE_CODE_PROVIDERS: ${{ vars.SANDRONE_PRIVATE_CODE_PROVIDERS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          METRICS_TOKEN: ${{ secrets.SANDRONE_METRICS_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          write() {
            if [[ "${2:-}" == *$'\n'* || "${2:-}" == *$'\r'* ]]; then
              printf '::error::%s must be a single-line value\n' "$1"
              exit 1
            fi
            [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> deploy/sandrone.env || true
          }

          : > deploy/sandrone.env
          write SANDRONE_HTTP_ADDR ":8080"
          write SANDRONE_LOG_LEVEL "info"
          write SANDRONE_BASE_PATH "$BASE_PATH"
          write GITHUB_APP_ID "$APP_ID"
          write GITHUB_WEBHOOK_SECRET "$WEBHOOK_SECRET"
          write MYSQL_DSN "$MYSQL_DSN"
          write REDIS_ADDR "$REDIS_ADDR"
          write REDIS_PASSWORD "$REDIS_PASSWORD"
          write REDIS_DB "0"
          write SANDRONE_WORKER_CONCURRENCY "2"
          write GEMINI_API_KEY "$GEMINI_API_KEY"
          write GROQ_API_KEY "$GROQ_API_KEY"
          write OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          write NVIDIA_API_KEY "$NVIDIA_API_KEY"
          write MISTRAL_API_KEY "$MISTRAL_API_KEY"
          write CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          write CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          write SANDRONE_PRIVATE_CODE_PROVIDERS "$PRIVATE_CODE_PROVIDERS"
          write SANDRONE_PROVIDER_COOLDOWN "15m"
          write SANDRONE_REQUEST_TIMEOUT "5m"
          write SANDRONE_LLM_MAX_CALLS_PER_OPERATION "12"
          write SANDRONE_REVIEW_RETENTION "4320h"
          write SANDRONE_DELIVERY_RETENTION "96h"
          write DASHBOARD_USERNAME "$DASHBOARD_USERNAME"
          write DASHBOARD_PASSWORD "$DASHBOARD_PASSWORD"
          write DASHBOARD_SESSION_SECRET "$DASHBOARD_SESSION_SECRET"
          write SANDRONE_METRICS_TOKEN "$METRICS_TOKEN"
          printf 'GITHUB_PRIVATE_KEY=%s\n' "$(printf '%s' "$APP_PRIVATE_KEY" | awk 'BEGIN{ORS=""} {printf "%s\\n", $0}')" >> deploy/sandrone.env

          {
            printf 'IMAGE=%s\n' "${IMAGE_NAME}:${GITHUB_SHA}"
            printf 'REVISION=%s\n' "$GITHUB_SHA"
            printf 'CONTAINER_NAME=%s\n' "$CONTAINER_NAME"
            printf 'DOCKER_NETWORK=%s\n' "$DOCKER_NETWORK"
            printf 'HOST_PORT=%s\n' "$HOST_PORT"
            printf 'BASE_PATH=%s\n' "$BASE_PATH"
            printf 'STOP_TIMEOUT=%s\n' "180"
            printf 'GHCR_USER=%s\n' "$GITHUB_ACTOR"
            printf 'GHCR_TOKEN=%s\n' "$GHCR_TOKEN"
          } > deploy/deploy.env

          echo "Wrote $(wc -l < deploy/sandrone.env) lines to deploy/sandrone.env"

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          remote_script='set -euo pipefail
          deploy_root=/tmp/sandrone-deploy
          cleanup() {
            status="$?"
            trap - EXIT HUP INT TERM
            if [ "$deploy_root" = "/tmp/sandrone-deploy" ]; then
              rm -rf -- "$deploy_root"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap "exit 124" HUP INT TERM
          if [ "$deploy_root" != "/tmp/sandrone-deploy" ]; then
            exit 1
          fi
          rm -rf -- "$deploy_root"
          umask 077
          mkdir -m 0700 -- "$deploy_root"
          tar -xzf - -C "$deploy_root"
          chmod 0700 "$deploy_root"
          chmod 0755 "$deploy_root"/scripts/*.sh
          chmod 0600 "$deploy_root"/*.env
          bash "$deploy_root/scripts/pull_image.sh"
          bash "$deploy_root/scripts/start_application.sh"'
          encoded_script="$(printf '%s' "$remote_script" | base64 -w 0)"
          tar -C deploy -czf - . | timeout --signal=TERM --kill-after=30s 2100s sshpass -e ssh \
            -p 22 \
            -o BatchMode=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$RUNNER_TEMP/sandrone-known-hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -c \"\$(printf %s '$encoded_script' | base64 -d)\""

      - name: Remove local env files
        if: always()
        run: rm -f deploy/sandrone.env deploy/deploy.env
