name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PACKAGE_NAME: sandrone-code-review-bot

jobs:
  deploy:
    name: 이미지 배포
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: 필수 시크릿 확인
        id: preflight
        env:
          APP_ID: ${{ secrets.SANDRONE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SANDRONE_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.SANDRONE_WEBHOOK_SECRET }}
          MYSQL_DSN: ${{ secrets.SANDRONE_MYSQL_DSN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          missing=""
          for name in APP_ID APP_PRIVATE_KEY WEBHOOK_SECRET MYSQL_DSN DEPLOY_HOST DEPLOY_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "${GEMINI_API_KEY:-}${GROQ_API_KEY:-}${OPENROUTER_API_KEY:-}${NVIDIA_API_KEY:-}" ]; then
            missing="$missing (LLM_API_KEY_중_최소_1개)"
          fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::시크릿이 없어 배포를 건너뛴다 —$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: QEMU 준비
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx 준비
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: ghcr.io 로그인
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드와 푸시
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 환경 파일 생성
        if: steps.preflight.outputs.ready == 'true'
        env:
          APP_ID: ${{ secrets.SANDRONE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SANDRONE_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.SANDRONE_WEBHOOK_SECRET }}
          MYSQL_DSN: ${{ secrets.SANDRONE_MYSQL_DSN }}
          REDIS_ADDR: ${{ secrets.SANDRONE_REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.SANDRONE_REDIS_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          METRICS_TOKEN: ${{ secrets.SANDRONE_METRICS_TOKEN }}
          PROVIDER_ORDER: ${{ vars.SANDRONE_PROVIDER_ORDER }}
          BASE_PATH: ${{ vars.SANDRONE_BASE_PATH }}
          BOT_NAME: ${{ vars.SANDRONE_BOT_NAME }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          DOCKER_NETWORK: ${{ vars.DEPLOY_DOCKER_NETWORK }}
          HOST_PORT: ${{ vars.DEPLOY_HOST_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          write() {
            [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> deploy/sandrone.env || true
          }

          : > deploy/sandrone.env
          write SANDRONE_HTTP_ADDR ":8080"
          write SANDRONE_BOT_NAME "${BOT_NAME:-sandrone-code-review-bot}"
          write SANDRONE_LOG_LEVEL "info"
          write SANDRONE_BASE_PATH "${BASE_PATH:-}"
          write GITHUB_APP_ID "$APP_ID"
          write GITHUB_WEBHOOK_SECRET "$WEBHOOK_SECRET"
          write MYSQL_DSN "$MYSQL_DSN"
          write REDIS_ADDR "$REDIS_ADDR"
          write REDIS_PASSWORD "$REDIS_PASSWORD"
          write SANDRONE_PROVIDER_ORDER "${PROVIDER_ORDER:-gemini,groq,openrouter,nvidia}"
          write GEMINI_API_KEY "$GEMINI_API_KEY"
          write GEMINI_MODEL "${GEMINI_MODEL:-}"
          write GROQ_API_KEY "$GROQ_API_KEY"
          write GROQ_MODEL "${GROQ_MODEL:-}"
          write OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          write OPENROUTER_MODEL "${OPENROUTER_MODEL:-}"
          write NVIDIA_API_KEY "$NVIDIA_API_KEY"
          write NVIDIA_MODEL "${NVIDIA_MODEL:-}"
          write DASHBOARD_USERNAME "$DASHBOARD_USERNAME"
          write DASHBOARD_PASSWORD "$DASHBOARD_PASSWORD"
          write DASHBOARD_SESSION_SECRET "$DASHBOARD_SESSION_SECRET"
          write SANDRONE_METRICS_TOKEN "$METRICS_TOKEN"
          printf 'GITHUB_PRIVATE_KEY=%s\n' "$(printf '%s' "$APP_PRIVATE_KEY" | awk 'BEGIN{ORS=""} {printf "%s\\n", $0}')" >> deploy/sandrone.env

          {
            printf 'IMAGE=%s\n' "${IMAGE_NAME}:${GITHUB_SHA}"
            printf 'REVISION=%s\n' "$GITHUB_SHA"
            printf 'CONTAINER_NAME=%s\n' "sandrone"
            printf 'DOCKER_NETWORK=%s\n' "${DOCKER_NETWORK:-readygsm-net}"
            printf 'HOST_PORT=%s\n' "${HOST_PORT:-10105}"
            printf 'BASE_PATH=%s\n' "${BASE_PATH:-}"
            printf 'GHCR_USER=%s\n' "$GITHUB_ACTOR"
            printf 'GHCR_TOKEN=%s\n' "$GHCR_TOKEN"
          } > deploy/deploy.env

          echo "환경 파일 $(wc -l < deploy/sandrone.env)줄을 만들었다"

      - name: 서버로 배포
        if: steps.preflight.outputs.ready == 'true'
        uses: 8G4B/GSM-SV-Deploy@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source_path: deploy
          target_path: /tmp/sandrone-deploy
          deployspec_path: deploy/deployspec.yml

      - name: 로컬 환경 파일 삭제
        if: always()
        run: rm -f deploy/sandrone.env deploy/deploy.env

      - name: ghcr 패키지 제거
        if: always() && steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GHCR_CLEANUP_TOKEN이 없어 ghcr 패키지를 남겨둔다"
            exit 0
          fi
          if gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}" --silent; then
            echo "ghcr 패키지를 제거했다"
          else
            echo "::warning::ghcr 패키지를 제거하지 못했다"
          fi
